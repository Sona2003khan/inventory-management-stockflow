<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Form - StockFlow</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #218838; }
        a { display: block; text-align: center; margin-top: 15px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2 th:text="${product.id != null} ? 'Edit Product' : 'Add New Product'">Product Form</h2>
        <form th:action="@{/products/save}" method="post" th:object="${product}">
            <input type="hidden" th:field="*{id}" />
            <input type="text" th:field="*{name}" placeholder="Product Name *" required />
            <input type="text" th:field="*{sku}" placeholder="SKU *" required />
            <textarea th:field="*{description}" placeholder="Description (Optional)"></textarea>
            <input type="number" th:field="*{quantityOnHand}" placeholder="Quantity on Hand *" required />
            <input type="number" step="0.01" th:field="*{costPrice}" placeholder="Cost Price (Optional)" />
            <input type="number" step="0.01" th:field="*{sellingPrice}" placeholder="Selling Price (Optional)" />
            <input type="number" th:field="*{lowStockThreshold}" placeholder="Low Stock Threshold (Optional)" />
            <button type="submit">Save Product</button>
        </form>
        <a href="/dashboard">Back to Dashboard</a>
    </div>
</body>
</html>

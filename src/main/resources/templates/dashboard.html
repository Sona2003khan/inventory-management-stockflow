<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard - StockFlow</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .header h2 { margin: 0; color: #333; }
        .logout { color: #dc3545; text-decoration: none; font-weight: bold; }
        .cards { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .card h3 { margin: 0 0 10px 0; color: #555; font-size: 16px; }
        .card p { margin: 0; font-size: 24px; font-weight: bold; color: #007bff; }
        .card.low p { color: #dc3545; }
        .section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; color: #333; }
        .btn-add { background: #28a745; color: white; padding: 8px 15px; border-radius: 4px; text-decoration: none; font-size: 14px; }
        .btn-add:hover { background: #218838; }
        .alert-box { background: #fff3cd; color: #856404; padding: 10px 15px; border-radius: 4px; margin-bottom: 15px; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

    <!-- Header with Settings & Logout -->
    <div class="header">
        <h2 th:text="'Welcome, ' + ${orgName}">Dashboard</h2>
        <div>
            <a href="/settings" style="margin-right: 15px; color: #007bff; text-decoration: none; font-weight: bold;">Settings</a>
            <a href="/logout" class="logout">Logout</a>
        </div>
    </div>

    <!-- Summary Metrics Cards -->
    <div class="cards">
        <div class="card">
            <h3>Total Products</h3>
            <p th:text="${totalProducts}">0</p>
        </div>
        <div class="card">
            <h3>Total Quantity on Hand</h3>
            <p th:text="${totalQuantity}">0</p>
        </div>
        <div class="card low">
            <h3>Low Stock Items</h3>
            <p th:text="${lowStockCount}">0</p>
        </div>
    </div>

    <!-- Low Stock Items Table Section (FR-6 Requirement) -->
    <div class="section" th:if="${lowStockCount > 0}">
        <h3 style="margin-top: 0; color: #dc3545;">⚠️ Low Stock Alerts</h3>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>SKU</th>
                    <th>Quantity on Hand</th>
                    <th>Low Stock Threshold</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${products}" th:if="${p.quantityOnHand <= (p.lowStockThreshold != null ? p.lowStockThreshold : 5)}">
                    <td th:text="${p.name}"></td>
                    <td th:text="${p.sku}"></td>
                    <td th:text="${p.quantityOnHand}" style="font-weight: bold; color: #dc3545;"></td>
                    <td th:text="${p.lowStockThreshold != null ? p.lowStockThreshold : 'Default (5)'}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Main Inventory Products Table & Search Bar -->
    <div class="section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0;">Inventory Products</h3>
            <form th:action="@{/dashboard}" method="get" style="display: flex; gap: 10px;">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by name or SKU..." style="padding: 6px; border: 1px solid #ccc; border-radius: 4px; width: 200px;" />
                <button type="submit" style="padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Search</button>
            </form>
            <a href="/products/new" class="btn-add">+ Add Product</a>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>SKU</th>
                    <th>Quantity</th>
                    <th>Selling Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${products.empty}">
                    <td colspan="5" style="text-align: center;">No products found.</td>
                </tr>
                <tr th:each="p : ${products}">
                    <td th:text="${p.name}"></td>
                    <td th:text="${p.sku}"></td>
                    <td th:text="${p.quantityOnHand}"></td>
                    <td th:text="${p.sellingPrice}"></td>
                    <td>
                        <a th:href="@{'/products/edit/' + ${p.id}}" style="color: #007bff; text-decoration: none; margin-right: 10px;">Edit</a>
                        <a th:href="@{'/products/delete/' + ${p.id}}" style="color: #dc3545; text-decoration: none;" onclick="return confirm('Are you sure you want to delete this product?');">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
